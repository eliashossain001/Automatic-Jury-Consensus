# Abstention-robustness variant of the GRPO judge bank: identical judges/adapters,
# but max_new_tokens raised 8 -> 32 so judges have room to reach an A/B verdict.
# Deterministic decoding preserved. Separate votes_dir; primary results untouched.
bank:
  - id: qwen-2.5-7b-grpo
    family: qwen
    scale: 7B
    hf_model: Qwen/Qwen2.5-7B-Instruct
    hf_revision: null
    adapter_path: results/grpo_judges/adapters/qwen-2.5-7b_seed0
    quantization: nf4
    dtype: bfloat16
  - id: mistral-7b-grpo
    family: mistral
    scale: 7B
    hf_model: mistralai/Mistral-7B-Instruct-v0.3
    hf_revision: null
    adapter_path: results/grpo_judges/adapters/mistral-7b-v0.3_seed0
    quantization: nf4
    dtype: bfloat16
  - id: phi-3.5-mini-grpo
    family: phi
    scale: 3.8B
    hf_model: microsoft/Phi-3.5-mini-instruct
    hf_revision: null
    adapter_path: results/grpo_judges/adapters/phi-3.5-mini_seed0
    quantization: nf4
    dtype: bfloat16
prompt_styles: [pairwise, likert]
generation: {max_new_tokens: 32, temperature: 0.0, do_sample: false}
runtime: {device: cuda, batch_size: 12, shuffle_position: true, position_seed: 20260601, max_length: 1024}
output: {votes_dir: results/grpo_judges/abstention_robustness/rewardbench_votes}
