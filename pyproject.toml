[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corrfilter"
version = "0.1.0"
description = "Measurement and deployment diagnostics for dependent errors in LLM judge consensus."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.44",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
    "datasets>=2.20",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
api = ["openai>=1.0", "google-generativeai>=0.8"]
training = ["peft>=0.12", "trl>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Historical experiment scripts preserve their original, auditable form. Keep
# repository-wide linting focused on syntax errors and undefined names.
select = ["E9", "F63", "F7", "F82"]
